version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "semiannually"
    open-pull-requests-limit: 3
    # Sem bloco `ignore`: os dois tetos que o justificavam caíram.
    # O do react-scripts saiu com a migração para Vite, e os 245
    # defaultProps viraram parâmetro padrão, liberando o React 19.
    groups:
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "semiannually"
    open-pull-requests-limit: 2
    groups:
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
      docker:
        patterns: ["*"]
