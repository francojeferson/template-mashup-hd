version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "semiannually"
    open-pull-requests-limit: 3
    # Os ignores de `typescript`, `react-redux`, `react-i18next` e
    # `@mui/styles` saíram: existiam pelo teto do react-scripts, que não
    # existe mais desde a migração para Vite. Todos já estão atualizados.
    #
    # Sobrou um, e por outro motivo: o React 19 removeu `defaultProps` em
    # componentes de função, e este projeto tem 81 arquivos que dependem
    # disso — nenhum deles é componente de classe. O upgrade não quebra
    # build nem tipo: os defaults simplesmente param de aplicar, em
    # silêncio. Converter os 81 para parâmetro padrão é pré-requisito.
    #
    # AO CONVERTER OS defaultProps: remova o bloco `ignore` inteiro.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "semiannually"
    open-pull-requests-limit: 2
    groups:
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
      docker:
        patterns: ["*"]
